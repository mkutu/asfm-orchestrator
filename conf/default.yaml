workspace:
  root: /home/mkutuga/asfm-orchestrator
  keep_local_scratch: true  # set false to delete local scratch after each run
  keep_local_report: true  # set false to delete local reports after each run, if keep_local_scratch is true this has no effect
  cleanup_staged_images: true  # delete staged images from NFS staging after a successful run

logging:
  level: INFO  # level for the per-run log file written to <run_root>/logs/, which is promoted to CERES with the rest of the run's outputs

run_status_db:
  enabled: false
  db_path: /mnt/research-projects/s/screberg/longterm_images2/semifield-asfm/db/autosfm_run_status.sqlite3
  promote_to_juno: false

database:
  path: /home/mkutuga/asfm-orchestrator/db/globus_file_index.sqlite3

  # Filters for selecting current developed JPGs from globus_file_index.
  # Leave values blank to avoid filtering by that column.
  inventory_filters:
    data_state: semifield-developed-images
    endpoint: f45a24f8-09ba-11ec-b342-1feaf93e3729
    site: CERES
    storage_domain: dash_agir
    namespace: 90daydata
    storage_root: /90daydata/dash_agir

  # DB-backed GCP lookup. If no match is found, paths.ceres_reference_root is
  # still used as a fallback: <root>/<season>/<STATE>.csv when season is known.
  reference_filters:
    enabled: true
    marker_path_fragment: GroundControlPoints
    season: peanuts_2026
    site_preference:
      - NCSU
      - CERES #90daydata
      - JUNO

manual_log:
  path: ./manual_log.csv
  required_columns:
    - batch_id
    - start_time
    - end_time
  optional_columns:
    - sub_batch_id
    - notes
    - cam_angle
    - z_axis
    - season
    - process

transfer:
  stage_inputs: false      # set false to skip re-staging — assumes run.paths already has images/reference
  promote_outputs: false   # set false to skip promoting outputs to CERES

globus:
  enabled: false
  dry_run: false
  wait_for_completion: true
  timeout_seconds:          # leave blank for no timeout
  
  cli: globus
  ceres_endpoint: f45a24f8-09ba-11ec-b342-1feaf93e3729
  ncsu_endpoint: 2f7f6170-8d5c-11e9-8e6a-029d279f7e24
  juno_endpoint: 904c2108-90cf-11e8-9672-0a6d4e044368
  poll_seconds: 30
  label_prefix: autosfm

paths:
  ncsu_share_root: /mnt/research-projects/s/screberg
  ncsu_share_globus_root: /rsstu/users/s/screberg
  local_scratch_root: /home/mkutuga/asfm-orchestrator/temp
  sunny_staging_root: /mnt/research-projects/s/screberg/longterm_images2/semifield-asfm/staging
  sunny_staging_globus_root: /rsstu/users/s/screberg/longterm_images2/semifield-asfm/staging
  
  # CERES-side source and output roots as seen by Globus endpoint paths.
  ceres_source_root: /90daydata/dash_agir/semifield-developed-images
  ceres_reference_root: /90daydata/dash_agir/semifield-utils/autosfm/GroundControlPoints
  ceres_output_root: /90daydata/dash_agir/semifield-asfm

  # JUNO-side root as seen by the JUNO Globus endpoint.
  juno_db_root: /LTS/project/dash_agir/semifield-asfm/db


autosfm:
  dry_run: true
  metashape_key_path: .keys/pipeline_keys.yaml
  crs: "32617"            # new — was inferred per-batch before, now explicit
  marker_bit: "14bit"      # new — was inferred from bbot_version before
  num_gpus: 1
  use_masking: false
  skip_first_n_images:
  skip_last_n_images:
  
  
  recover_unaligned_only: false
  recover_rematch: false
  align_correct: false

  add_photos: true

  resize_photos: true
  downscale:
    factor: 0.25

  detect_markers: true
  import_references: true

  match: true
  align: true
  align_photos:
    downscale: 1
    autosave: true
    generic_preselection: false
    reference_preselection: false
    filter_stationary_points: false
    adaptive_fitting: false

  optimize_cameras: true
  optimize_cameras_cfg:
    fit_f: true
    fit_cx: true
    fit_cy: true
    fit_b1: true
    fit_b2: true
    fit_k1: true
    fit_k2: true
    fit_k3: true
    fit_k4: true
    fit_p1: true
    fit_p2: true
    fit_corrections: false
    adaptive_fitting: false
    tiepoint_covariance: false

  build_depth: true
  depth_map:
    downscale: 4
    filtering_mode: moderate
    max_neighbors: -1
    autosave: true

  build_dense: true
  dense_cloud:
    points_spacing: 0.1
    autosave: true

  build_model: true
  model:
    autosave: true

  build_dem: true
  dem:
    autosave: true
    export:
      enabled: false

  build_ortho: true
  orthomosaic:
    autosave: true
    export:
      enabled: false

  export_fov: true
  export_pixel_grid: true
  pixel_grid:
    step: 100
  export_pixel_grid_samples: true
  pixel_grid_samples:
    count: 25
    seed: 42
  export_report: true